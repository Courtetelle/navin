<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>NavIn · essai SP10X</title>
    <style>
      /* Development only: NavIn at the size of the Sailproof SP10X screen
         (10 inches, 800 x 1280 pixels), to judge it on an iPad. */
      :root {
        color-scheme: light dark;
        --bg: #1b1f27;
        --fg: #e8ecf2;
        --btn: #2c3340;
        --on: #0b3d91;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.3 -apple-system,
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        height: 52px;
      }
      header b {
        margin-right: auto;
      }
      button {
        min-height: 40px;
        padding: 4px 12px;
        border: 0;
        border-radius: 10px;
        background: var(--btn);
        color: var(--fg);
        font: inherit;
        font-weight: 600;
      }
      button[aria-pressed='true'] {
        background: var(--on);
        color: #fff;
      }
      #stage {
        position: absolute;
        inset: 52px 0 0;
        overflow: hidden;
      }
      #frame {
        position: absolute;
        left: 50%;
        top: 50%;
        border: 14px solid #000;
        border-radius: 22px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
        transform-origin: center;
      }
      iframe {
        display: block;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Essai SP10X · <span id="size"></span></b>
      <button type="button" data-size="1280x800" aria-pressed="true">
        Paysage 1280 × 800
      </button>
      <button type="button" data-size="800x1280">Portrait</button>
      <button type="button" data-size="960x600">Paysage 960 × 600</button>
      <button type="button" id="reload">↻</button>
    </header>
    <div id="stage">
      <div id="frame"><iframe id="app" src="./" title="NavIn"></iframe></div>
    </div>
    <script>
      // 1280 x 800 if the tablet shows one CSS pixel per screen pixel, as
      // most 10-inch Android tablets of this resolution; 960 x 600 if it
      // enlarges by a third.
      const app = document.getElementById('app');
      const frame = document.getElementById('frame');
      const stage = document.getElementById('stage');
      let size = [1280, 800];
      function fit() {
        const [w, h] = size;
        app.style.width = `${w}px`;
        app.style.height = `${h}px`;
        const room = stage.getBoundingClientRect();
        const scale = Math.min(
          1,
          (room.width - 16) / (w + 28),
          (room.height - 16) / (h + 28),
        );
        frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
        document.getElementById('size').textContent =
          `${w} × ${h} px, affiché à ${Math.round(scale * 100)} %`;
      }
      for (const button of document.querySelectorAll('[data-size]')) {
        button.addEventListener('click', () => {
          size = button.dataset.size.split('x').map(Number);
          for (const other of document.querySelectorAll('[data-size]')) {
            other.setAttribute('aria-pressed', String(other === button));
          }
          fit();
        });
      }
      document.getElementById('reload').addEventListener('click', () => {
        app.src = './';
      });
      addEventListener('resize', fit);
      fit();
    </script>
  </body>
</html>
